appId: ${APP_ID}
name: "Many projects - A13, seed many (200 projects, 10 000 calculations), the Projects tab lists them and the search finds one"
tags:
  - perf
---
# scripts/e2e.sh <platform> development .maestro/extra/many-projects.yaml ; timings: node scripts/flow-times.mjs <log> (see V1_LOG P7)
- runFlow:
    file: ../subflows/seed.yaml
    env:
      SEED: many
- tapOn:
    id: tab-projects
- extendedWaitUntil:
    visible: "Project 200.*"
    timeout: 20000
- takeScreenshot: many-projects-list
- tapOn:
    id: project-search
- inputText: "Project 150"
- extendedWaitUntil:
    visible: "Project 150.*"
    timeout: 10000
- assertNotVisible: "Project 151.*"
- takeScreenshot: many-projects-search
